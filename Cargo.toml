[workspace]
members = ["crates/herdr-protocol", "crates/tavern-client", "tools/import-protocol"]
default-members = ["crates/herdr-protocol", "crates/tavern-client"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "=2.0.1", features = ["serde"] }
herdr-protocol = { path = "crates/herdr-protocol" }

[patch.crates-io]
bincode = { path = "vendor/crates/bincode-2.0.1" }
bincode_derive = { path = "vendor/crates/bincode_derive-2.0.1" }
unty = { path = "vendor/crates/unty-0.0.4" }
virtue = { path = "vendor/crates/virtue-0.0.18" }
libc = { path = "vendor/crates/libc-0.2.190" }

[profile.release]
opt-level = 2
# macOS 27 rejects dylibs damaged by LLVM's debug stripping (rust-lang/rust#157750).
strip = "none"
